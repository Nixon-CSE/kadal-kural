[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kadal-kural"
version = "1.0.0"
description = "Zero-Screen B2B Pre-Dispatch Credit Firewall built on Gnani AI's Artha Stack"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nixon Immanuel Motha" }]
# Floors include the security fixes found by pip-audit (Nov 2026); several need Python >= 3.10.
dependencies = [
    "fastapi>=0.135.0",
    "starlette>=1.3.1",          # Host-header URL validation, form limits, method dispatch fixes
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.2.2",      # symlink-following in set_key/unset_key
    "websockets>=14.0",
    "rapidfuzz>=3.9.0",
    "python-multipart>=0.0.31",  # multipart/urlencoded parser DoS and Content-Length fixes
    "anyio>=4.14.2",             # TLS hostname check for IDNs, worker pipe deadlock
]

[project.optional-dependencies]
bench = ["numpy>=1.26.0", "jiwer>=3.0.0"]
dev = [
    "httpx2>=2.16.0",  # test client transport (starlette deprecates httpx here)
    "pytest>=9.0.3",
    "pip-audit>=2.9.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "numpy>=1.26.0",
    "jiwer>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kadal_kural = ["data/*.json", "api/static/*", "api/static/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "benchmark"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so results don't shift with ruff's defaults across versions.
select = ["E", "F", "W", "I", "B", "BLE", "SIM", "RUF100"]
ignore = ["E501"]  # line length is enforced by the formatter budget, not per line

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Header", "fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Measurement scripts isolate each live call: one failed stream is recorded, not raised.
"scripts/**" = ["BLE001"]
"benchmark/**" = ["BLE001"]
"tests/**" = ["SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["kadal_kural", "benchmark"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
