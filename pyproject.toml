[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kadal-kural"
version = "1.0.0"
description = "Zero-Screen B2B Pre-Dispatch Credit Firewall built on Gnani AI's Artha Stack"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Nixon Immanuel Motha" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
