name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Official Python images: hosted runners no longer ship 3.9 (EOL), but it is the floor we support.
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests benchmark scripts
      - name: Type check (mypy --strict)
        run: mypy src
      - name: Tests (no network, no API key)
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    container: node:20-slim
    steps:
      - uses: actions/checkout@v5
      - name: Install (lockfile)
        working-directory: web
        run: npm ci
      - name: Type-check and build the desk
        working-directory: web
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t kadal-kural:ci .
      - name: Smoke test /healthz
        run: |
          docker run -d --name kk -p 8000:8000 kadal-kural:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && exit 0; sleep 1; done
          docker logs kk; exit 1
