name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests benchmark scripts
      - name: Type check (mypy --strict)
        run: mypy src
      - name: Tests (no network, no API key)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kadal-kural:ci .
      - name: Smoke test /healthz
        run: |
          docker run -d --name kk -p 8000:8000 kadal-kural:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && exit 0; sleep 1; done
          docker logs kk; exit 1
