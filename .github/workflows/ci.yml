name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests benchmark scripts
      - name: Type check (mypy --strict)
        run: mypy src
      - name: Tests (no network, no API key)
        run: pytest -q

  audit:
    # Known vulnerabilities in what ships: Python runtime deps and the desk's production npm deps.
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: pip install --upgrade pip && pip install -e . pip-audit
      - name: pip-audit (installed environment)
        run: pip-audit --skip-editable --progress-spinner off

  npm-audit:
    runs-on: ubuntu-latest
    container: node:20-slim
    steps:
      - uses: actions/checkout@v7
      - name: npm audit (production dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate

  web:
    runs-on: ubuntu-latest
    container: node:20-slim
    steps:
      - uses: actions/checkout@v7
      - name: Install (lockfile)
        working-directory: web
        run: npm ci
      - name: Type-check and build the desk
        working-directory: web
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, web, audit]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t kadal-kural:ci .
      - name: Smoke test /healthz
        run: |
          docker run -d --name kk -p 127.0.0.1:8000:8000 kadal-kural:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          curl -fsS localhost:8000/healthz || { docker logs kk; exit 1; }
          # the hardening is live in the image: security headers, and a cross-site write is refused
          curl -fsS -D - -o /dev/null localhost:8000/ | grep -i "content-security-policy"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' localhost:8000/api/v1/reset)" = 403
          test "$(docker inspect -f '{{.Config.User}}' kk)" = "app"
